org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Where the app sends API requests. Set it to your Cloud Run URL (terraform output api_url),
# here or with -Pfoundwith.apiUrl=... on the command line. The default reaches a backend running
# on the same computer as the Android emulator.
foundwith.apiUrl=http://10.0.2.2:8080

# Debug builds only: sign in with "dev:<number>" tokens instead of SMS. Works only against a
# backend started with AUTH_MODE=dev (never production).
foundwith.devSignIn=false

# Your privacy policy's web address. Google Play requires a link to it inside the app; release
# builds refuse to build without it. Shown on the consent screen and in Settings.
foundwith.privacyUrl=
