<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhoHas</title>
<style>
  :root { --bg:#f7f7f5; --text:#1d1d1b; --muted:#6b6b66; --accent:#2f5fd0; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141413; --text:#ececea; --muted:#a3a39e; --accent:#8fb0ff; } }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:48px 16px; }
  h1 { font-size:24px; margin:0 0 8px; }
  p { color:var(--muted); margin:8px 0; }
  a { color:var(--accent); font-weight:600; text-decoration:none; }
</style>
</head>
<body>
<main>
  <h1>WhoHas</h1>
  <p>See who has any number, even when someone unknown calls. People you know are shown by name. On Android.</p>
  <p>Questions: <a href="mailto:help@found-with.app">help@found-with.app</a></p>
</main>
</body>
</html>
