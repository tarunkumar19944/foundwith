# Builds the Android app on every change under android/ and keeps the APKs for 14 days.
#
# Optional settings (repository Settings > Secrets and variables > Actions):
#   variable FOUNDWITH_API_URL      the API's address; defaults to the live server below
#   secret   GOOGLE_SERVICES_JSON   the contents of google-services.json, for SMS sign-in
#   secret   DEBUG_KEYSTORE_BASE64  base64 of a debug.keystore, so every build has the same SHA-1
#                                   (the one you registered in Firebase)
name: Android

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Firebase config and debug key
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "google-services.json written: SMS sign-in is on"
          else
            echo "::notice::No GOOGLE_SERVICES_JSON secret. The APK builds, but SMS sign-in is off."
          fi
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
            echo "Using the debug key from DEBUG_KEYSTORE_BASE64"
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testFullDebugUnitTest

      - name: Build debug APKs
        env:
          API_URL: ${{ vars.FOUNDWITH_API_URL || 'https://found-with-api-zda4qqks6q-el.a.run.app' }}
        run: ./gradlew --no-daemon assembleFullDebug assembleContactsOnlyDebug -Pfoundwith.versionCode=${{ github.run_number }} ${API_URL:+-Pfoundwith.apiUrl=$API_URL}

      - name: Lint (report only)
        continue-on-error: true
        run: ./gradlew --no-daemon lintFullDebug

      - name: Summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          tests = failures = 0
          for f in glob.glob("app/build/test-results/**/*.xml", recursive=True):
              r = ET.parse(f).getroot()
              tests += int(r.get("tests", 0)); failures += int(r.get("failures", 0)) + int(r.get("errors", 0))
          print(f"Unit tests: {tests} run, {failures} failed")
          for f in glob.glob("app/build/reports/lint-results-*.xml"):
              issues = ET.parse(f).getroot().findall("issue")
              by = {}
              for i in issues:
                  by.setdefault(i.get("severity"), []).append(i)
              print(f"Lint ({f.split('/')[-1]}): " + ", ".join(f"{len(v)} {k}" for k, v in sorted(by.items())) or "no issues")
              for sev in ("Fatal", "Error", "Warning"):
                  for i in by.get(sev, []):
                      loc = i.find("location")
                      where = f"{loc.get('file', '').split('/app/')[-1]}:{loc.get('line', '')}" if loc is not None else ""
                      print(f"  {sev} {i.get('id')} {where} {i.get('message')}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: found-with-debug-apks
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 14
          if-no-files-found: ignore
