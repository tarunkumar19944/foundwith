# Builds the Android app on every change under android/ and keeps the APKs for 14 days.
#
# On pushes to main the app's Firebase config (SMS sign-in, push) and the debug signing key come
# from Secret Manager in the foundwith project, keylessly (infra/terraform/android_ci.tf).
#
# Optional settings (repository Settings > Secrets and variables > Actions), used instead when set:
#   variable FOUNDWITH_API_URL      the API's address; defaults to the live server below
#   secret   GOOGLE_SERVICES_JSON   the contents of google-services.json, for SMS sign-in
#   secret   DEBUG_KEYSTORE_BASE64  base64 of a debug.keystore, so every build has the same SHA-1
#                                   (the one you registered in Firebase)
name: Android

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write   # to publish the test build as a GitHub release
  id-token: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
      # Robolectric downloads Android's own code (about 150 MB) from Maven Central for the unit tests
      # that run Android code; that download sometimes times out on GitHub. Keep it between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('android/gradle/libs.versions.toml') }}

      - name: Sign in to Google Cloud
        id: gcp
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.repository == 'tarunkumar19944/foundwith'
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/462748736171/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: found-with-android-ci@whohas-prod-515506.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.gcp.outcome == 'success'

      - name: Firebase config and debug key
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          FROM_GCP: ${{ steps.gcp.outcome == 'success' }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ] && [ "$FROM_GCP" = "true" ]; then
            GOOGLE_SERVICES_JSON="$(gcloud secrets versions access latest --project=whohas-prod-515506 --secret=found-with-android-google-services 2>/dev/null || true)"
          fi
          if [ -z "$DEBUG_KEYSTORE_BASE64" ] && [ "$FROM_GCP" = "true" ]; then
            DEBUG_KEYSTORE_BASE64="$(gcloud secrets versions access latest --project=whohas-prod-515506 --secret=found-with-android-debug-keystore 2>/dev/null || true)"
          fi
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "google-services.json written: SMS sign-in and push are on"
          else
            echo "::notice::No Firebase config. The APK builds, but SMS sign-in is off."
          fi
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "DEBUG_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
            keytool -list -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -alias androiddebugkey | grep -E "SHA1:"
            echo "Signing with the project's debug key"
          else
            echo "::notice::No debug key: this APK's signature won't match the one registered for SMS sign-in."
          fi
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS" 2>/dev/null || true

      - name: Unit tests
        run: ./gradlew --no-daemon testFullDebugUnitTest

      # Pictures of the new screen pieces, drawn by the unit tests (ScreensTest), on the "screens" branch.
      - name: Publish screen pictures
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -n "$(ls app/build/screens/*.png 2>/dev/null)" ] || { echo "No pictures"; exit 0; }
          out="$RUNNER_TEMP/screens"; rm -rf "$out"; mkdir -p "$out"; cp app/build/screens/*.png "$out/"
          cd "$out"
          git init -q -b screens
          git add .
          git -c user.name="WhoHas CI" -c user.email="ci@users.noreply.github.com" commit -qm "Screens from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screens

      - name: Build debug APKs
        env:
          API_URL: ${{ vars.FOUNDWITH_API_URL || 'https://found-with-api-lg62ek6lma-el.a.run.app' }}
        run: ./gradlew --no-daemon assembleFullDebug assembleContactsOnlyDebug -Pfoundwith.versionCode=${{ github.run_number }} -Pfoundwith.publicUrl=https://whohas-app.web.app ${API_URL:+-Pfoundwith.apiUrl=$API_URL} ${DEBUG_KEYSTORE:+-Pfoundwith.debugKeystore=$DEBUG_KEYSTORE}

      - name: Lint (report only)
        continue-on-error: true
        run: ./gradlew --no-daemon lintFullDebug

      - name: Summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          tests = failures = 0
          for f in glob.glob("app/build/test-results/**/*.xml", recursive=True):
              r = ET.parse(f).getroot()
              tests += int(r.get("tests", 0)); failures += int(r.get("failures", 0)) + int(r.get("errors", 0))
          print(f"Unit tests: {tests} run, {failures} failed")
          for f in glob.glob("app/build/reports/lint-results-*.xml"):
              issues = ET.parse(f).getroot().findall("issue")
              by = {}
              for i in issues:
                  by.setdefault(i.get("severity"), []).append(i)
              print(f"Lint ({f.split('/')[-1]}): " + ", ".join(f"{len(v)} {k}" for k, v in sorted(by.items())) or "no issues")
              for sev in ("Fatal", "Error", "Warning"):
                  for i in by.get(sev, []):
                      loc = i.find("location")
                      where = f"{loc.get('file', '').split('/app/')[-1]}:{loc.get('line', '')}" if loc is not None else ""
                      print(f"  {sev} {i.get('id')} {where} {i.get('message')}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: whohas-debug-apks
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 14
          if-no-files-found: ignore

      # A stable download link for phones: the latest main build, replaced on every push.
      # https://github.com/<owner>/<repo>/releases/download/test-build/whohas-test.apk
      - name: Publish test build
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp "$(find app/build/outputs/apk/full -name '*.apk' | head -1)" whohas-test.apk
          cp "$(find app/build/outputs/apk/contactsOnly -name '*.apk' | head -1)" whohas-test-contacts-only.apk
          # Refuse to publish an APK that SMS sign-in would reject.
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          signer=$("$apksigner" verify --print-certs whohas-test.apk | grep -m1 "SHA-1 digest" | awk '{print $NF}')
          echo "Signed with SHA-1 $signer"
          [ "$signer" = "f0d83ac3dce3ae06b642e4f0ffe7526572d6a2a7" ] || { echo "::error::APK isn't signed with the project's debug key"; exit 1; }
          gh release delete test-build --yes --cleanup-tag 2>/dev/null || true
          gh release create test-build whohas-test.apk whohas-test-contacts-only.apk \
            --prerelease --target "$GITHUB_SHA" --title "Test build ${GITHUB_SHA::7}" \
            --notes "Latest test build from main (${GITHUB_SHA::7}, build ${{ github.run_number }}). It talks to the live server. On your phone, install whohas-test.apk. whohas-test-contacts-only.apk is the Google Play version, without the call log."
