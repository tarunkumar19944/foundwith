# The phone tests (android/app/src/androidTest): the app used end to end, as a person would, on
# Firebase Test Lab. Emulators for every Android version on each app change; real phones from the
# brands people in India use every week (and by hand). Results, videos and screenshots are in the
# Firebase console, under Test Lab. Nothing secret is stored in GitHub: the Firebase config, the
# signing key and the test number's code come from Secret Manager, keylessly.
#
# Cost: Test Lab gives 60 emulator minutes and 30 real-phone minutes a day free; beyond that about
# $1 per emulator-hour and $5 per phone-hour. A real-phone run of all 14 phones is roughly $5.
name: Phone tests

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/phone-tests.yml", "tests/live/phone_fixture.py"]
  schedule:
    - cron: "30 21 * * 0"   # Mondays 3:00 am IST: real phones
  workflow_dispatch:
    inputs:
      devices:
        description: "emulators, phones or both"
        default: "both"
      phone_models:
        description: "Only these real phones (space-separated model=…,version=… entries; empty for all)"
        default: ""

permissions:
  contents: write   # publishes screenshots and logs as the test-screens release
  id-token: write

concurrency:
  # Pushes replace each other; a run started by hand (say, a few real phones) isn't cancelled by a push.
  group: phone-tests-${{ github.event_name }}
  cancel-in-progress: true

env:
  PROJECT: whohas-prod-515506
  API_URL: https://found-with-api-lg62ek6lma-el.a.run.app
  # Emulators: every Android version from 8 to 16, a small phone and a tablet.
  EMULATORS: >-
    model=MediumPhone.arm,version=26 model=MediumPhone.arm,version=28 model=MediumPhone.arm,version=30
    model=MediumPhone.arm,version=31 model=MediumPhone.arm,version=33 model=MediumPhone.arm,version=34
    model=MediumPhone.arm,version=35 model=MediumPhone.arm,version=36 model=SmallPhone.arm,version=30
    model=MediumTablet.arm,version=33
  # Real phones: the brands most used in India, old and new, a foldable and a tablet.
  PHONES: >-
    model=a10,version=29 model=a14m,version=34 model=a16,version=35 model=houji,version=35
    model=OP5759L1,version=34 model=RE58C2,version=35 model=RMX3231,version=30 model=OP5958L1,version=34
    model=TECNO-BG6,version=33 model=Infinix-X6525,version=33 model=caprip,version=31 model=akita,version=35
    model=b6qsqw,version=36 model=gta9pwifi,version=34

jobs:
  phones:
    if: github.repository == 'tarunkumar19944/foundwith'
    runs-on: ubuntu-latest
    # Real phones can wait hours in Test Lab's queue (90, then 180 minutes ran out on 16-17 Nov).
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/462748736171/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: found-with-android-ci@whohas-prod-515506.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Config, signing key and test account
        run: |
          set -euo pipefail
          umask 077
          gcloud secrets versions access latest --project=$PROJECT --secret=found-with-android-google-services > android/app/google-services.json
          gcloud secrets versions access latest --project=$PROJECT --secret=found-with-android-debug-keystore | base64 -d > "$RUNNER_TEMP/debug.keystore"
          gcloud secrets versions access latest --project=$PROJECT --secret=found-with-test-accounts > "$RUNNER_TEMP/live.json"
          code=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['test_numbers']['+919000000010'])" "$RUNNER_TEMP/live.json")
          echo "::add-mask::$code"
          echo "FW_CODE=$code" >> "$GITHUB_ENV"

      - name: Build the app and its phone tests
        working-directory: android
        run: >-
          ./gradlew --no-daemon assembleFullDebug assembleFullDebugAndroidTest
          assembleContactsOnlyDebug assembleContactsOnlyDebugAndroidTest
          -Pfoundwith.apiUrl=$API_URL -Pfoundwith.debugKeystore=$RUNNER_TEMP/debug.keystore
          -Pfoundwith.versionCode=${{ github.run_number }}

      - name: The caller the tests expect is on WhoHas
        run: cd tests/live && python3 phone_fixture.py "$RUNNER_TEMP/live.json"

      - name: Which devices
        id: which
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          ASKED: ${{ github.event.inputs.devices }}
        run: |
          # Emulators on every app change; real phones weekly, by hand, or when a commit says [phones].
          case "${{ github.event_name }}" in
            schedule) set=phones ;;
            workflow_dispatch) set="${ASKED:-both}" ;;
            *) case "$MESSAGE" in *"[phones]"*) set=both ;; *) set=emulators ;; esac ;;
          esac
          echo "set=$set" >> "$GITHUB_OUTPUT"

      - name: Run on Test Lab
        env:
          SET: ${{ steps.which.outputs.set }}
          ONLY_PHONES: ${{ github.event.inputs.phone_models }}
        run: |
          set -uo pipefail
          apks=android/app/build/outputs/apk
          run() {   # run <label> <flavour> <devices...>
            label=$1; flavour=$2; shift 2
            args=(); for d in "$@"; do args+=(--device "$d"); done
            echo "::group::$label"
            gcloud firebase test android run --project=$PROJECT --type=instrumentation \
              --app "$apks/$flavour/debug/app-$flavour-debug.apk" \
              --test "$apks/androidTest/$flavour/debug/app-$flavour-debug-androidTest.apk" \
              "${args[@]}" \
              --environment-variables "fwCode=$FW_CODE,fwNumber=9000000010,fwCaller=+919000000077" \
              --results-bucket=$PROJECT-test-lab --results-dir="run-$GITHUB_RUN_ID-$label" \
              --directories-to-pull=/sdcard/Android/data/app.foundwith/files \
              --timeout=15m --num-flaky-test-attempts=1 --format=json > "$RUNNER_TEMP/$label.json"
            status=$?
            echo "::endgroup::"
            python3 - "$RUNNER_TEMP/$label.json" "$label" <<'PY'
          import json, sys
          rows = json.load(open(sys.argv[1])) if open(sys.argv[1]).read().strip() else []
          print(f"\n{sys.argv[2]}:")
          for r in rows:
              print(f"  {r.get('outcome','?'):8} {r.get('axis_value','?'):40} {r.get('test_details','')}")
          PY
            return $status
          }
          failed=0
          if [ "$SET" = emulators ] || [ "$SET" = both ]; then
            run emulators full $EMULATORS || failed=1
            run contacts-only contactsOnly model=MediumPhone.arm,version=34 || failed=1
          fi
          if [ -n "${ONLY_PHONES:-}" ]; then PHONES="$ONLY_PHONES"; fi
          if [ "$SET" = phones ] || [ "$SET" = both ]; then
            # Real phones can wait hours in Test Lab's queue, so start them without waiting and
            # check on them every minute, for up to 4.5 hours.
            args=(); for d in $PHONES; do args+=(--device "$d"); done
            echo "::group::phones"
            gcloud firebase test android run --async --project=$PROJECT --type=instrumentation \
              --app "$apks/full/debug/app-full-debug.apk" \
              --test "$apks/androidTest/full/debug/app-full-debug-androidTest.apk" \
              "${args[@]}" \
              --environment-variables "fwCode=$FW_CODE,fwNumber=9000000010,fwCaller=+919000000077" \
              --results-bucket=$PROJECT-test-lab --results-dir="run-$GITHUB_RUN_ID-phones" \
              --directories-to-pull=/sdcard/Android/data/app.foundwith/files \
              --timeout=15m --num-flaky-test-attempts=1 2> "$RUNNER_TEMP/phones.txt"
            cat "$RUNNER_TEMP/phones.txt"
            matrix=$(grep -o 'matrix-[a-z0-9]*' "$RUNNER_TEMP/phones.txt" | head -1)
            echo "::endgroup::"
            if [ -z "$matrix" ]; then
              echo "::error::The phone run didn't start"; failed=1
            else
              api="https://testing.googleapis.com/v1/projects/$PROJECT/testMatrices/$matrix"
              deadline=$(( $(date +%s) + 270 * 60 ))
              while :; do
                curl -sS -H "Authorization: Bearer $(gcloud auth print-access-token)" "$api" > "$RUNNER_TEMP/matrix.json"
                state=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("state",""))' "$RUNNER_TEMP/matrix.json")
                case "$state" in FINISHED|ERROR|INVALID|CANCELLED) break ;; esac
                if [ "$(date +%s)" -gt "$deadline" ]; then
                  echo "::warning::Phones still not done after 4.5 hours: cancelling the rest"
                  curl -sS -X POST -H "Authorization: Bearer $(gcloud auth print-access-token)" "$api:cancel" > /dev/null
                  break
                fi
                sleep 60
              done
              python3 - "$RUNNER_TEMP/matrix.json" <<'PY'
          import json, sys
          m = json.load(open(sys.argv[1]))
          print(f"\nphones: {m.get('state')} {m.get('outcomeSummary', '')}")
          for e in m.get("testExecutions", []):
              d = e.get("environment", {}).get("androidDevice", {})
              detail = e.get("testDetails", {}).get("errorMessage") or ""
              print(f"  {e.get('state','?'):12} {d.get('androidModelId','?')}-{d.get('androidVersionId','?'):4} {detail}")
          PY
              summary=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("outcomeSummary",""))' "$RUNNER_TEMP/matrix.json")
              case "$summary" in SUCCESS|FLAKY) ;; *) failed=1 ;; esac
            fi
          fi
          echo "Results, videos and screenshots: https://console.firebase.google.com/project/$PROJECT/testlab/histories/"
          exit $failed

      - name: What failed, by phone
        if: failure()
        run: |
          for f in $(gcloud storage ls "gs://$PROJECT-test-lab/run-$GITHUB_RUN_ID-*/**/test_result_*.xml" 2>/dev/null); do
            python3 - "$f" <<'PY'
          import subprocess, sys, xml.etree.ElementTree as ET
          path = sys.argv[1]
          xml = subprocess.run(["gcloud", "storage", "cat", path], capture_output=True, text=True).stdout
          root = ET.fromstring(xml)
          device = path.split("/")[-2]
          for case in root.iter("testcase"):
              for problem in list(case.findall("failure")) + list(case.findall("error")):
                  first = (problem.text or problem.get("message") or "").strip().splitlines()[:4]
                  print(f"::error::{device} {case.get('name')}: {' | '.join(first)}")
          PY
          done

      - name: App logs and screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          out="$RUNNER_TEMP/screens"; mkdir -p "$out"
          files=$(gcloud storage ls "gs://$PROJECT-test-lab/run-$GITHUB_RUN_ID-*/**" 2>/dev/null || true)
          for f in $(echo "$files" | grep '/logcat$'); do
            name=$(echo "$f" | awk -F/ '{print $4"/"$5}')
            echo "::group::app log $name"
            gcloud storage cat "$f" 2>/dev/null | grep -E "FoundWith|WhoHas|AndroidRuntime|FATAL|WM-WorkerWrapper.*AfterCall" | tail -100
            echo "::endgroup::"
          done
          # Screenshots: one copy per device (not per file), first attempt only.
          for device in $(echo "$files" | grep '\.png$' | awk -F/ '{print "gs://"$3"/"$4"/"$5}' | grep -v rerun | sort -u); do
            dir="$out/$(echo "$device" | awk -F/ '{print $4"-"$5}')"
            mkdir -p "$dir"
            gcloud storage cp "$device/**.png" "$dir/" >/dev/null 2>&1 || true
          done
          (cd "$out" && zip -qr "$RUNNER_TEMP/screens.zip" .) || exit 0
          gh release delete test-screens --yes --cleanup-tag 2>/dev/null || true
          gh release create test-screens "$RUNNER_TEMP/screens.zip" --prerelease --target "$GITHUB_SHA" \
            --title "Phone test screenshots ${GITHUB_SHA::7}" --notes "Screenshots from the latest phone tests (run $GITHUB_RUN_ID), one folder per device."
