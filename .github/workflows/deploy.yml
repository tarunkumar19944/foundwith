# Deploys the server whenever backend/ changes on main: runs cloudbuild.yaml in the foundwith
# project (tests, image, migrations, deploy, /readyz check). No keys: GitHub's sign-in token is
# exchanged for the deployer service account (infra/terraform/cicd.tf), and only for this
# repository's main branch.
name: Deploy server

on:
  push:
    branches: [main]
    paths: ["backend/**", "cloudbuild.yaml", ".gcloudignore", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  PROJECT_ID: whohas-prod-515506
  REGION: asia-south1

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/462748736171/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: found-with-deployer@whohas-prod-515506.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build, migrate and deploy
        run: |
          set -euo pipefail
          id=$(gcloud builds submit --async --project="$PROJECT_ID" --region="$REGION" \
            --config=cloudbuild.yaml --substitutions=SHORT_SHA="${GITHUB_SHA::7}" \
            --gcs-source-staging-dir="gs://$PROJECT_ID-build-source/source" --format='value(id)' .)
          echo "Cloud Build $id: https://console.cloud.google.com/cloud-build/builds;region=$REGION/$id?project=$PROJECT_ID"
          while true; do
            status=$(gcloud builds describe "$id" --project="$PROJECT_ID" --region="$REGION" --format='value(status)')
            case "$status" in
              SUCCESS) echo "Deployed ${GITHUB_SHA::7}"; exit 0 ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                gcloud builds describe "$id" --project="$PROJECT_ID" --region="$REGION" --format='table(steps.id,steps.status)'
                echo "::error::Cloud Build $status"; exit 1 ;;
            esac
            sleep 20
          done
